<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Milon-PT logo</title>
	<style>
		:root {
			--bg: #0a0a0b;
			--surface: #121214;
			--surface-2: #1b1b1e;
			--text: #f2f2f0;
			--muted: #8e8e94;
			--line: rgba(255, 255, 255, 0.08);
			--accent: #5eead4;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: 32px 20px 64px;
			background: var(--bg);
			color: var(--text);
			font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
		}
		h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
		p.lead { color: var(--muted); margin: 0 0 32px; }
		section { border-top: 1px solid var(--line); padding: 28px 0; }
		h2 { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
		h2 span { color: var(--muted); font-family: ui-monospace, monospace; font-weight: 400; margin-left: 8px; }
		p.desc { color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
		.row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 32px; }
		figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
		figcaption { color: var(--muted); font: 12px ui-monospace, monospace; }
		svg { display: block; }
		.mint { color: var(--accent); }
		.white { color: #fff; }
		.icon { background: var(--bg); border-radius: 22%; outline: 1px solid var(--line); color: var(--accent); }
		.icon.light { background: #f3f2ee; color: #0d6b63; }
		.icon svg { width: 100%; height: 100%; }
		.stack { display: flex; flex-direction: column; gap: 16px; }
		@media (max-width: 600px) { .big svg { width: 100%; max-width: 256px; height: auto; } }
	</style>
</head>
<body>
	<h1>Milon-PT logo</h1>
	<p class="lead">An M that is also a dumbbell. Drawn in currentColor so it takes the accent color.</p>
	<main id="out"></main>
	<script>
		// Copy of the symbol in logo.svg (a file:// page cannot load it and keep currentColor). Keep the two in sync.
		const LOGO = {
			title: 'Milon-PT: ett M som är en hantel, stången böjer sig i ett V mellan skivorna under tung vikt',
			body: '<g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M30 28V68M66 28V68" /><path d="M16 40V56M80 40V56" /><path d="M30 40L48 58L66 40" /></g>'
		};
		const svg = (size, cls = '') =>
			`<svg class="${cls}" viewBox="0 0 96 96" width="${size}" height="${size}" role="img" aria-label="${LOGO.title}">${LOGO.body}</svg>`;
		const fig = (inner, cap) => `<figure>${inner}<figcaption>${cap}</figcaption></figure>`;
		const icon = (size, light = false) =>
			fig(`<div class="icon${light ? ' light' : ''}" style="width:${size}px;height:${size}px">${svg(size)}</div>`, `${light ? 'light ' : ''}icon ${size}`);
		document.getElementById('out').innerHTML = `<section>
			<h2>Milon-PT<span>logo.svg</span></h2>
			<p class="desc">${LOGO.title.replace('Milon-PT: ', '')}</p>
			<div class="stack">
				<div class="row big">${fig(svg(256, 'mint'), '256')}${fig(svg(64, 'mint'), '64')}${fig(svg(32, 'mint'), '32')}</div>
				<div class="row">${icon(180)}${icon(64)}${icon(32)}</div>
				<div class="row">${icon(180, true)}${icon(64, true)}${icon(32, true)}</div>
				<div class="row">${fig(svg(128, 'white'), 'white 128')}${fig(svg(64, 'white'), 'white 64')}${fig(svg(32, 'white'), 'white 32')}${fig(svg(16, 'white'), 'white 16')}</div>
			</div>
		</section>`;
	</script>
</body>
</html>
