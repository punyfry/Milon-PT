<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Milon avatar</title>
	<style>
		:root { --bg: #0a0a0b; --surface: #121214; --surface-2: #1b1b1e; --text: #f2f2f0; --muted: #8e8e94; --line: rgba(255, 255, 255, 0.08); --accent: #5eead4; }
		.light { --bg: #f3f2ee; --surface: #ffffff; --surface-2: #e8e7e2; --text: #18181a; --muted: #66655f; --line: rgba(0, 0, 0, 0.08); --accent: #0d6b63; }
		* { box-sizing: border-box; }
		body { margin: 0; background: #0a0a0b; color: #f2f2f0; font: 14px/1.5 system-ui, sans-serif; }
		.theme { background: var(--bg); color: var(--text); padding: 24px 20px; }
		h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
		h2 { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
		p { color: var(--muted); margin: 0 0 16px; }
		section { border-top: 1px solid var(--line); padding: 20px 0; }
		.row { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; }
		figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
		figcaption { color: var(--muted); font: 12px ui-monospace, monospace; }
		svg { display: block; color: var(--accent); overflow: visible; }
		.disc { border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
		.chat { display: flex; gap: 10px; align-items: flex-start; max-width: 340px; }
		.bubble { background: var(--surface); border-radius: 14px; padding: 8px 12px; color: var(--text); }
		/* Thinking, option 1: the whole symbol pulses between full and dimmed color. */
		.pulse { animation: pulse 1.6s ease-in-out infinite; }
		@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
		/* Thinking, option 2: both eyes blink together; the mouth stays. */
		.eye { transform-box: fill-box; transform-origin: center; }
		.blink .eye { animation: blink 1.6s ease-in-out infinite; }
		@keyframes blink { 0%, 70%, 100% { transform: scaleY(1); } 80% { transform: scaleY(0.15); } }
		@media (prefers-reduced-motion: reduce) { .pulse, .blink .eye { animation: none; } }
	</style>
</head>
<body>
	<div class="theme"><h1>Logo to Milon</h1><p>logo-to-milon.svg (SMIL, 4 s loop, inlined here so it takes the accent color) and logo-to-milon.gif.</p><div class="row"><figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="160" height="160" role="img" aria-label="Milon-PT">
	<g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
		<path d="M30 28V68"><animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.35;0.7;0.9;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" values="M30 28V68;M30 28V68;M8 28V68;M8 28V68;M30 28V68;M30 28V68" /><animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.26;0.79;0.9;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" values="1;1;0;0;1;1" /></path>
		<path d="M66 28V68"><animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.35;0.7;0.9;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" values="M66 28V68;M66 28V68;M88 28V68;M88 28V68;M66 28V68;M66 28V68" /><animate attributeName="opacity" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.26;0.79;0.9;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" values="1;1;0;0;1;1" /></path>
		<path d="M16 40V56"><animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.35;0.5;0.53;0.56;0.7;0.9;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" values="M16 40V56;M16 40V56;M30 26V46;M30 26V46;M30 35V37;M30 26V46;M30 26V46;M16 40V56;M16 40V56" /></path>
		<path d="M80 40V56"><animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.35;0.5;0.53;0.56;0.7;0.9;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" values="M80 40V56;M80 40V56;M66 26V46;M66 26V46;M66 35V37;M66 26V46;M66 26V46;M80 40V56;M80 40V56" /></path>
		<path d="M30 40L48 58L66 40"><animate attributeName="d" dur="4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.15;0.35;0.7;0.9;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" values="M30 40L48 58L66 40;M30 40L48 58L66 40;M34 62L48 74L62 62;M34 62L48 74L62 62;M30 40L48 58L66 40;M30 40L48 58L66 40" /></path>
	</g>
</svg><figcaption>svg</figcaption></figure><figure><img src="logo-to-milon.gif" width="160" height="160" alt=""><figcaption>gif</figcaption></figure></div></div>
	<div id="out"></div>
	<script>
		// Copy of the symbol in milon.svg.
		const BODY = '<g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path class="eye eye-l" d="M30 26V46" /><path class="eye eye-r" d="M66 26V46" /><path class="mouth" d="M34 62L48 74L62 62" /></g>';
		const svg = (size, state = '') => `<svg class="${state}" viewBox="0 0 96 96" width="${size}" height="${size}" role="img" aria-label="Milon">${BODY}</svg>`;
		const disc = (size, state = '') => `<div class="disc" style="width:${size}px;height:${size}px">${svg(size * 0.8, state)}</div>`;
		const fig = (inner, cap) => `<figure>${inner}<figcaption>${cap}</figcaption></figure>`;
		const block = (state, title, desc) => `<section><h2>${title}</h2><p>${desc}</p><div class="row">
			${fig(svg(120, state), 'intro')}${fig(disc(28, state), 'chat')}${fig(svg(28, state), 'alone 28')}
			<div class="chat">${disc(28, state)}<div class="bubble">Jag lägger upp ett överkroppspass…</div></div>
		</div></section>`;
		const theme = (cls, title) => `<div class="theme ${cls}"><h1>${title}</h1><p>Intro size and chat size (28 px), in a circle and on its own.</p>` +
			block('', 'Resting', 'Two short plates as eyes, the V from the logo as mouth.') +
			block('pulse', 'Thinking 1: pulse', 'The whole symbol pulses between full and dimmed color.') +
			block('blink', 'Thinking 2: blink', 'Both eyes blink together; the mouth stays.') + '</div>';
		document.getElementById('out').innerHTML = theme('', 'Milon avatar, dark') + theme('light', 'Milon avatar, light');
	</script>
</body>
</html>
