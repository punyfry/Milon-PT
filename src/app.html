<!doctype html>
<html lang="sv">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- PWA: added to the home screen. src/service-worker.ts provides simple offline support. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
		<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/dm-mono-500-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Applies the chosen theme before first paint. A file, not inline, so the CSP (script-src 'self') allows it. -->
		<script src="/theme-init.js"></script>
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Milon" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="application-name" content="Milon-PT" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
